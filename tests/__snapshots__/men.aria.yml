  - img "Men On Fire — first Sunday every month at 6 PM"
  - paragraph: First Sunday · 6 PM
  - heading "Men On Fire" [level=2]
  - paragraph: On the first Sunday of every month, all men gather around the fire pit — one place, one purpose. It’s a time for brotherhood, real conversation about Scripture, and powerful prayer.
  - heading "Relationships" [level=3]
  - paragraph: We host two to three events each year that enable men to hang out with other men. This is an enjoyable time to have fun, deepen friendships, get to know one another and encourage one another.
  - heading "Service" [level=3]
  - paragraph: We are fortunate to have partnered with multiple local ministries and strive to lead our men to participate in opportunities to support and serve alongside our mission partners.
  - heading "Join the brotherhood" [level=2]
  - paragraph: Studies, the fire pit, serving shoulder-to-shoulder — there's a seat for you.
