  - paragraph: Good to know
  - heading "Making Sunday mornings easy" [level=2]
  - heading "Drop-Off Tips" [level=3]
  - paragraph: It’s completely normal for little ones to feel a bit unsure during drop-off. From our experience, a quick goodbye usually helps them adjust faster. If you have special instructions or requests, please let us know. We want your child to feel safe and secure, and for you to feel at ease.
  - heading "What to Bring" [level=3]
  - paragraph: We have diapers and wipes if you need them. Just pack a labeled bottle or water cup for your child.
  - heading "What to Wear" [level=3]
  - paragraph: Your child will love playing outside (weather permitting) and getting creative with crafts like painting and coloring. Comfortable, easy-to-clean clothes are perfect.
