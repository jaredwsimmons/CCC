  - heading "Get Ready For Sunday" [level=2]
  - paragraph: If you are coming to worship with us for the first time soon, please click the button below to pre-register your family with us. This will make your check-in time very quick on Sunday morning! Our Preschool Check-In desk is through the entrance on the right side of the building, past the Worship Room.
