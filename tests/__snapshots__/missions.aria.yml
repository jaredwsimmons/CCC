  - heading "Missions" [level=1]
  - paragraph: /"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you\." \(Matthew \d+:\d+–20a\)/
  - paragraph: Deacon
  - paragraph: Jared Simmons
  - paragraph: Serving and praying over this ministry — reach out anytime.
  - paragraph: Monthly missions highlight
  - heading "The Big Kaboom" [level=2]
  - paragraph: /The Big Kaboom is coming up on Saturday, June \d+, and Chelsea Community Church is partnering with other local churches to provide a free Kids Zone for families in our community! The Kids Zone will feature inflatables, face painting, games, and other fun activities for children\. We're looking for volunteers from 7:\d+–7:\d+ PM to assist with activities in the Kids Zone or help at our church booth\. We'd love for you to join us — contact Pastor Brian for more information\./
  - link "Contact Pastor Brian":
    - /url: mailto:brian@chelseachurch.com
  - img /Big Kaboom — Saturday, June \d+, 7:\d+–7:\d+ PM\. We need you! Contact Brian Marbury or scan the QR code to volunteer\./
