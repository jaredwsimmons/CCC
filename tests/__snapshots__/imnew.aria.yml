  - text: 5th Sundays
  - heading "Family Worship" [level=3]
  - paragraph: 5th Sundays
  - paragraph: Worship Room
  - paragraph: On the fifth Sunday of the month only, Preschool through Students join the whole church for family worship instead of their usual age-graded programming.
  - heading "How to Dress" [level=3]
  - paragraph: Come dressed comfortably! Whether you’re in jeans and a t-shirt or coat and tie, you will fit in with us.
  - heading "Where to Go First" [level=3]
  - paragraph: Our building has three covered entrances in the front. The Worship Room, Connections Desk, and Preschool Hall are most easily accessed through the entrance on the right. If you have an elementary-aged kid or a teenager, their activities are on the left side of the building, and it’s best to enter through the second covered door. There will be greeters at each of these doors to help you find your way.
  - paragraph: Before you arrive
  - heading "Let us know you're coming!" [level=2]
  - paragraph: We can’t wait to meet you! Before you arrive, we’d love for you to share just a little bit of contact information with us. Don’t worry — we’ll keep it safe and only use it to thank you for visiting and to share any information you’d like to know about us.
  - heading "Prefer to connect in person?" [level=3]
  - paragraph: If you’re not ready to fill out the form or prefer to connect in person, that’s okay too! Be sure to stop by our Connections Desk — it’s just past the Worship Room. There, you can learn more about who we are, what we’re about, and pick up a special gift we’ve prepared just for you. We’re so glad you’re here!
  - link "Let us know you're coming!":
    - /url: https://chelseachurch.churchcenter.com/people/forms/869246?open-in-church-center-modal=true