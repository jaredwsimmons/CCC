  - paragraph: Our Beliefs
  - heading "What we hold to" [level=2]
  - text: /2 Timothy 3:\d+-\d+; 2 Peter 1:\d+-\d+; Hebrews 4:\d+/
  - heading "The Bible" [level=3]
  - paragraph: /We believe that the Scriptures in all \d+ books of the Old and New Testaments are verbally inspired of God, error free in the original manuscripts, and the supreme authority of faith and practice for followers of Christ\./
  - text: Deuteronomy 6:4
  - heading "God" [level=3]
  - paragraph: We believe there is one living and true God, who is one in essence, while eternally existing in three distinct persons; Father, Son, and Holy Spirit.
  - text: /Genesis 1:\d+-\d+; Romans 1:\d+-\d+, 3:\d+-\d+/
  - heading "Man" [level=3]
  - paragraph: We believe that mankind was directly created in the image of God to enjoy His fellowship and fulfill His purposes on earth. However, in Adam, all mankind fell into sin; consequently all people are spiritually dead and subject to the certainty of both physical and spiritual death apart from faith in Jesus Christ.
  - text: /John 1:\d+, 3:\d+, \d+:6; Ephesians 2:8-9/
  - heading "Salvation" [level=3]
  - paragraph: We believe that salvation is by grace alone, through faith alone in Jesus Christ alone. All who believe in Him are declared righteous by the Father on the grounds of Jesus Christ’s life, death and resurrection, being regenerated by and baptized in the Holy Spirit.
  - text: /Acts 2:\d+-\d+; Hebrews \d+:\d+-\d+; 1 Corinthians \d+-\d+/
  - heading "The Church" [level=3]
  - paragraph: We believe that all who are “born again” by the Holy Spirit belong to the one true church and are instructed by the Scriptures to associate themselves in local, visible churches.
  - text: /Matthew \d+:\d+-\d+; Romans 6:3-7; 1 Corinthians \d+:\d+-\d+/
  - heading "Ordinances" [level=3]
  - paragraph: We believe that baptism is an essential “first step” for all who, having believed in Christ for salvation, desire to walk as His disciple. Baptism is a clear injunction of the Scriptures which outwardly expresses the inward reality of new life in Christ. Our method of baptism is immersion as described in the New Testament and practiced in the early church. We believe that the Lord’s Supper is a memorial of Christ and His redemptive death. It is also an expression of our fellowship with one another. In communion, we are reminded of Christ’s first coming and encouraged to look forward to His coming again.
  - text: /Matthew \d+:\d+; 1 Thessalonians 4:\d+-\d+/
  - heading "The Future" [level=3]
  - paragraph: We believe the next great event of human history will be the personal return of Jesus Christ. This is the blessed hope for which all those who love Christ yearn. While the exact time of Christ’s return is unknown, it is imminent and certain.
  - heading "Church Bylaws" [level=3]
  - paragraph: How we govern ourselves as a congregation — Christ ruled, elder led, and congregationally accountable.
  - paragraph:
    - link "Read our church bylaws →":
