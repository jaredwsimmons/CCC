  - paragraph: How we got here
  - heading "Planting roots as Chelsea grows" [level=2]
  - list:
    - listitem:
      - heading /\d+/ [level=3]
      - paragraph: Double Oak Community Church begins meeting in Mt. Laurel, with a heart to reach the growing metro area.
    - listitem:
      - heading /\d+/ [level=3]
      - paragraph: A Chelsea campus opens at Chelsea Park Elementary, then builds under the clocktower.
    - listitem:
      - heading /\d+/ [level=3]
      - paragraph: The congregation votes to pursue independence.
    - listitem:
      - heading /\d+/ [level=3]
      - paragraph: We become Chelsea Community Church, planting roots as Chelsea grows.
  - paragraph: While maintaining our autonomy as a local body of believers, we identify ourselves as a community church in the Baptist tradition.
  - link "Learn about Double Oak Community Church →":
    - /url: https://docc.org/
  - paragraph: God's Story
  - heading "The Bible tells the story of God pursuing us." [level=2]
  - paragraph: From the very beginning, God has pursued us. When Adam and Eve sinned, they hid among the trees of the garden, but God went after them. “The Lord God called to the man, ‘Where are you?’” (Genesis 3:8-9).
  - paragraph: /He pursued us most fully in Jesus, who came “to seek and to save that which is lost” \(Luke \d+:\d+\), through His life, death, and resurrection\./
  - paragraph: He still pursues us today. Through the Holy Spirit, He comforts us, corrects us, and conforms us to the image of His Son. There is no greater joy than following Him in response to His incredible love for us in Christ Jesus.
  - img "Detail of Michelangelo’s Creation of Adam — two hands reaching toward one another"
