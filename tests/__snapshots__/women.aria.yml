  - paragraph: /Spotlight · Monday, July \d+/
  - heading "Sundae Funday Bingo" [level=2]
  - paragraph: /Ladies, mark your calendars for a sweet summer evening of fun, fellowship, and friendly competition! Join us for Sundae Funday Bingo on July \d+ from 6:\d+–7:\d+ PM in the Community Room\. Enjoy an evening filled with bingo, prizes, laughter, and delicious ice cream sundaes!/
  - paragraph: To make our sundae bar extra special, please bring your favorite sundae topping or a salty snack to share. We'll provide the ice cream, and together we'll create a fun and tasty treat table for everyone to enjoy.
  - paragraph: As part of the evening, we'll also take a few moments to learn about All4 Jesus Belize and the incredible ways God is working through their ministry. You'll have an opportunity to support their upcoming mission trip through a voluntary donation that will help provide much-needed supplies.
  - paragraph: /This event is free, but please RSVP by July \d+ so we can prepare accordingly\. We hope you'll join us for a wonderful evening of connection, encouragement, sweet treats, and lots of fun!/
  - link "RSVP for Sundae Funday Bingo":
    - /url: https://chelseachurch.churchcenter.com/registrations/events/3694679?open-in-church-center-modal=true
