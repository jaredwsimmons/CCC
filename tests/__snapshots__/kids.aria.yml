- main:
  - paragraph: Ministries
  - heading "Kids" [level=1]
  - paragraph: Our Kids Ministry exists to train up children to pursue God and to pursue others. By providing a safe and loving environment, we create space for kids to explore their Bible and build strong, lasting relationships that mirror Christ’s love. We also champion the role of families, equipping them to pass on their own faith to their children.
  - paragraph: Deacon
  - paragraph: Pam Cooley
  - paragraph: Serving and praying over this ministry — reach out anytime.
