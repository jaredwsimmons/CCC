  - paragraph: Family worship
  - heading "Worship Together" [level=2]
  - paragraph: At Chelsea Community Church we believe that the family is God’s main tool for calling children into a life of faith. Because of that we want to encourage you to consider having your kids attend the main worship service alongside you each Sunday, especially 3rd–5th graders. This way Worship Together is a load lifted with two arms, at home and at church.
