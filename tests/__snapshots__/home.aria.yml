  - paragraph: Current sermon series
  - heading "Jesus Storyteller" [level=2]
  - paragraph: "/This summer, join us for Jesus Storyteller: Learning from the Parables of Jesus — a journey through the unforgettable stories Jesus used to reveal truth, challenge hearts, and invite people into the Kingdom of God\\. From lost sons and good Samaritans to persistent widows and mustard seeds, these timeless parables still speak powerfully today\\. Come discover how the stories Jesus told can transform the way we live, love, and follow Him\\. Join us Sunday at 9:\\d+ or \\d+:\\d+ AM!/"
