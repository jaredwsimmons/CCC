  - heading "Welcome to Chelsea Community Church" [level=2]
  - paragraph: Chelsea Community Church exists to pursue God and pursue others, and we desire to be known as a people who love God and love others well. Our heart is to live life together by worshiping the Father, growing in faith, and sharing in fellowship and ministry with each other.
