  - heading "This week at Chelsea" [level=2]
  - paragraph: Every week
  - list:
    - listitem:
      - paragraph: /Sundays · 9:\d+ & \d+:\d+ AM/
      - heading "Sunday Worship" [level=3]
      - paragraph: Two identical worship gatherings, with Preschool and Kids programming at both hours. Student community groups meet at 9:00 AM.
    - listitem:
      - paragraph: Sundays & Wednesdays
      - heading "Kids & Students" [level=3]
      - paragraph: Preschool and Kids meet at both Sunday services. Middle and high school students meet at 9:00 AM on Sundays and 6:00 PM on Wednesdays.
    - listitem:
      - paragraph: Everyday
      - heading "Community Groups" [level=3]
      - paragraph: Adults do life together in groups throughout the week.
    - listitem:
      - paragraph: 5th Sundays
      - heading "Family Worship" [level=3]
      - paragraph: On the fifth Sunday of the month only, Preschool through Students join the whole church for family worship instead of their usual age-graded programming.
