  - paragraph: Teams Mobilizer
  - heading "Know your purpose" [level=2]
  - paragraph: We invite you to join us on this journey of pursuit by checking out our Teams Mobilizer tool. This resource assists us in finding our place, knowing our purpose and being a people of pursuit.
  - paragraph: It's not a spiritual gifts inventory, and it doesn't sign you up to serve on a team. You'll get an email with your results, and you'll be contacted by Ben Stephenson to talk more about where God might be calling you to serve.
  - link "Click here to take the survey":
    - /url: https://volunteeraccelerator.ministryarchitects.com/DOCC/survey.php
  - img "Teams Mobilizer — find your place, know your purpose, be people of pursuit"
  - heading "It Is:" [level=3]
  - list:
    - listitem: A way to match people to ministry positions within the local church.
    - listitem: Through a quick survey, our leadership can learn your unique skills and desires and you can learn which serving opportunities are the best match for you!
  - heading "It Is Not:" [level=3]
  - list:
    - listitem: An automatic, team member sign up. (By completing the survey, you are not signing up for anything.)
    - listitem: A new church database. (This doesn't have addresses or any financial information; this is just names, emails, phone numbers, and what you say you have a heart for.)
    - listitem: A spiritual gifts inventory. (This tool matches the practical skills that you possess, along with your interests, with a real ministry opportunity in the church where you can serve.)
  - heading "Questions about serving?" [level=2]
  - paragraph: Ben Stephenson, our Family Pastor, is the one to ask.
  - link "Email Ben for more information!":
    - /url: mailto:ben@chelseachurch.com