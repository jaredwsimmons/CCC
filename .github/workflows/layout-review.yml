name: Review page layouts

on:
  pull_request:
    paths:
      - '.github/workflows/layout-review.yml'
      - 'playwright.layout-review.config.ts'
      - 'scripts/review/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.layout-review.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-layout-review
          path: layout-review/
          retention-days: 7
